name: CI

on:
  push:
    branches: [feat/mvp-forward-loop, feat/mvp-forward-loop-ui]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npm run eval:ai
      - name: Check server syntax
        run: |
          for file in server/*.mjs scripts/*.mjs; do
            node --check "$file"
          done
