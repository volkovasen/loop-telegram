name: CI

on:
  push:
    branches: [feat/mvp-forward-loop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Check server syntax
        run: |
          for file in server/*.mjs; do
            node --check "$file"
          done
